[package]
name = "forecast-score"
version = "0.1.0"
edition = "2021"
description = "Forecast verification metrics for meteorological and probabilistic predictions"
license = "MIT OR Apache-2.0"
keywords = ["forecast", "verification", "meteorology", "scoring", "weather"]
categories = ["science", "mathematics"]

[features]
default = []
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "10", optional = true, features = ["serde-compat"] }

[dev-dependencies]
serde_json = "1.0"

