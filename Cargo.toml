[package]
name = "forecast-score"
version = "0.1.0"
edition = "2021"
description = "Forecast verification metrics for meteorological and probabilistic predictions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wrfcoin/forecast-score"
keywords = ["forecast", "verification", "meteorology", "scoring", "weather"]
categories = ["science", "mathematics"]

[features]
default = []
ts = ["dep:ts-rs"]
meteo-types = ["dep:meteo-types"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "10", optional = true, features = ["serde-compat"] }
meteo-types = { path = "../meteo-types", optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha3 = "0.10"
hex = "0.4"
rustc-hash = "2"
thiserror = "2"
serde_json = "1"

[dev-dependencies]
serde_json = "1.0"
